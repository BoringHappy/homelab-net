# ============================================================
# 部署模式：ipvlan L2（容器独立局域网 IP，共享宿主机网卡 MAC）
# 适用于交换机/路由器对 MAC 地址数量有限制的网络。
# 使用：docker compose -f docker-compose.ipvlan.yml up -d --build
#
# 注意：与 macvlan 一样，宿主机自身无法直接访问容器 IP
# （Linux 内核刻意隔离），宿主机访问请走发布端口。
# ============================================================
services:
  net:
    build:
      context: ./net
    container_name: unified-net
    hostname: unified-net
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      # mihomo 配置：直接编辑 net/mihomo/config.example.yaml
      - ./net/mihomo/config.example.yaml:/etc/mihomo/config.yaml:ro
      # 持久化身份/状态（如需重新注册，删除对应卷即可）
      - ts-state:/var/lib/tailscale
      - warp-state:/var/lib/cloudflare-warp
      - cfd-state:/etc/cloudflared
    ports:
      # 宿主机访问容器时走这里（局域网设备直接访问 NET_IP）
      - "7890:7890"
      - "9090:9090"
    networks:
      # 同时保留默认 bridge（端口发布/宿主机访问）和 ipvlan（局域网固定 IP）
      default: {}
      ipvlan_net:
        ipv4_address: ${NET_IP:-192.168.5.50}

networks:
  ipvlan_net:
    name: ipvlan_net
    driver: ipvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:-enp3s0}
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: ${MACVLAN_SUBNET:-192.168.5.0/24}
          gateway: ${MACVLAN_GATEWAY:-192.168.5.1}

volumes:
  ts-state:
  warp-state:
  cfd-state:
