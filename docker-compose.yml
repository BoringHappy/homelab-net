services:
  # 统一网络容器：mihomo + tailscale + cloudflare mesh + cloudflare tunnel
  # 共享同一个网络命名空间，其余容器用 network_mode: service:net 复用
  net:
    build:
      context: ./net
    container_name: unified-net
    hostname: unified-net
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      # mihomo 配置：直接编辑 net/mihomo/config.example.yaml，
      # 或复制为 net/mihomo/config.yaml 后改这里的挂载路径
      - ./net/mihomo/config.example.yaml:/etc/mihomo/config.yaml:ro
      # 持久化身份/状态（如需重新注册，删除对应卷即可）
      - ts-state:/var/lib/tailscale
      - warp-state:/var/lib/cloudflare-warp
      - cfd-state:/etc/cloudflared
    ports:
      # mihomo mixed 代理端口（可选，给局域网设备用）
      - "7890:7890"
      # mihomo 控制面板（可选）
      - "9090:9090"
    networks:
      # 局域网固定 IP（网卡/网段/网关/IP 都在 .env 里配，网卡变了不用改 compose）
      macvlan_net:
        ipv4_address: ${NET_IP:-192.168.5.50}

networks:
  macvlan_net:
    name: macvlan_net
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT:-enp3s0}
    ipam:
      config:
        - subnet: ${MACVLAN_SUBNET:-192.168.5.0/24}
          gateway: ${MACVLAN_GATEWAY:-192.168.5.1}

volumes:
  ts-state:
  warp-state:
  cfd-state:
