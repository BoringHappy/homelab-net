# ============================================================
# 部署模式：宿主机 IP（默认 bridge + 端口映射）
# 容器不占用局域网 IP，局域网设备通过「宿主机IP:端口」访问。
# 使用：docker compose -f docker-compose.host-ip.yml up -d --build
# ============================================================
services:
  net:
    build:
      context: ./net
    container_name: unified-net
    hostname: unified-net
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    dns:
      # 让 Docker 内置 DNS 的域名解析最终也走 mihomo（fake-ip）
      - 127.0.0.1
    volumes:
      # mihomo 配置：直接编辑 mihomo/config.example.yaml
      - ./mihomo/config.example.yaml:/etc/mihomo/config.yaml:ro
      # 持久化身份/状态（如需重新注册，删除对应卷即可）
      - ts-state:/var/lib/tailscale
      - warp-state:/var/lib/cloudflare-warp
      - cfd-state:/etc/cloudflared
    ports:
      # mihomo mixed 代理端口（局域网设备通过 宿主机IP:7890 使用）
      - "7890:7890"
      # mihomo 控制面板
      - "9090:9090"
      # mihomo DNS（可选；宿主机 53 端口已被占用时不要开）
      # - "53:53/udp"

volumes:
  ts-state:
  warp-state:
  cfd-state:
